<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Google Sans", Roboto, system-ui, sans-serif; color: #fff; }
  .box {
    position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
    background: rgba(18, 18, 22, .9);
    border: 1px solid rgba(255, 255, 255, .14);
    display: flex; flex-direction: column;
    animation: in .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes in { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .head { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; flex: none; }
  .head svg { width: 22px; height: 22px; flex: none; animation: ring 1s ease-in-out 3; transform-origin: 50% 10%; }
  @keyframes ring { 0%,100% { transform: rotate(0); } 20% { transform: rotate(14deg); } 40% { transform: rotate(-12deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }
  .title { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { position: absolute; right: 10px; bottom: 12px; z-index: 1; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: rgba(0,0,0,.5); color: rgba(255,255,255,.8); }
  .cam { flex: 1; min-height: 0; background: #000; position: relative; }
  .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: .6; font-size: 15px; }
  .live { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.5); font-size: 12px; padding: 3px 9px; border-radius: 99px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #ff5a4f; }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.55); width: 100%; transform-origin: left; }
  /* Nachrichten */
  body.msg .box { position: absolute; inset: 0 0 auto 0; }
  .mbox { display: none; flex-direction: column; }
  body.msg .mbox { display: flex; }
  body.msg .head, body.msg .cam { display: none; }
  .mimg { width: 100%; display: block; object-fit: cover; background: #000; }
  .mtext { padding: 16px 20px 20px; }
  .mtitle { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; margin-bottom: 6px; }
  .mtitle svg { width: 22px; height: 22px; flex: none; opacity: .85; }
  .mbody { font-size: 17px; line-height: 1.45; color: rgba(255,255,255,.88); white-space: pre-wrap; word-wrap: break-word; }
  .mhint { margin-top: 12px; font-size: 12px; opacity: .5; }
  .mbar { height: 3px; background: rgba(255,255,255,.55); transform-origin: left; }
</style>
</head>
<body>
<div class="box">
  <div class="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0 7 7 0 0 1 4 6v3l2 3H4l2-3v-3a7 7 0 0 1 4-6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg>
    <span class="title" id="title"></span>
  </div>
  <div class="cam" id="cam"><div class="hint">Taste drücken zum Schließen</div><div class="bar" id="bar"></div></div>
  <div class="mbox" id="mbox">
    <img class="mimg" id="mimg" alt="" hidden>
    <div class="mtext">
      <div class="mtitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg><span id="mtitle"></span></div>
      <div class="mbody" id="mbody"></div>
      <div class="mhint">Taste drücken zum Schließen</div>
    </div>
    <div class="mbar" id="mbar"></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('mode') === 'msg') {
    document.body.classList.add('msg');
    const secsM = Number(q.get('s')) || 15;
    const t = q.get('t') || '', m = q.get('m') || '', im = q.get('img');
    document.getElementById('mtitle').textContent = t || 'Nachricht';
    document.getElementById('mbody').textContent = m;
    if (!m) document.getElementById('mbody').style.display = 'none';
    const box = document.querySelector('.box');
    // Bildhöhe fest am Bildschirm begrenzen (nicht an der Fensterhöhe, die sich beim Anpassen ändert)
    const el = document.getElementById('mimg');
    el.style.maxHeight = Math.round((screen.height || 1080) * 0.55) + 'px';
    let last = 0;
    const fit = () => { const h = Math.ceil(box.offsetHeight) + 2; if (h !== last) { last = h; try { PopupHost.resize(h); } catch (e) {} } };
    if (im) { el.hidden = false; el.onload = fit; el.onerror = () => { el.hidden = true; fit(); }; el.src = im; }
    try { new ResizeObserver(fit).observe(box); } catch (e) {}
    setTimeout(fit, 30); setTimeout(fit, 400); setTimeout(fit, 1200);
    document.getElementById('mbar').animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: secsM * 1000, fill: 'forwards', easing: 'linear' });
  } else {
  document.getElementById('title').textContent = q.get('t') || 'Es klingelt';
  const src = q.get('src');
  const secs = Number(q.get('s')) || 30;
  const cam = document.getElementById('cam');
  if (src) {
    const img = new Image();
    img.src = src;
    cam.insertBefore(img, cam.firstChild);
    const live = document.createElement('div'); live.className = 'live';
    live.innerHTML = '<i></i><span>Live</span>';
    cam.appendChild(live);
    if (src.indexOf('/camera_proxy/') >= 0) {
      setInterval(() => { img.src = src + '&_=' + Date.now(); }, 1500);
      live.lastChild.textContent = 'Bild';
    }
  } else {
    const n = document.createElement('div'); n.className = 'none'; n.textContent = 'Kein Kamerabild'; cam.appendChild(n);
  }
  document.getElementById('bar').animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: secs * 1000, fill: 'forwards', easing: 'linear' });
  }
</script>
</body>
</html>
