name: App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bildwerkzeug installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick file

      - name: Hintergrundfotos laden
        run: bash tools/fetch_backgrounds.sh

      - name: APK bauen
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease --console=plain 2>&1 | tee build.log; then
            { grep -E "^e: |^ERROR|error:" build.log; grep -A6 "What went wrong" build.log; } | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk tv-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-home
          path: tv-home.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TV Home ${{ github.run_number }}
          files: tv-home.apk
          make_latest: true
