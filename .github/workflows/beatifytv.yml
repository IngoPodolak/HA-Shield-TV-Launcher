name: Beatify TV (Android) bauen

on:
  push:
    branches: [main]
    paths: ["beatifytv/**", ".github/workflows/beatifytv.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        run: |
          set -o pipefail
          if ! gradle :beatifytv:assembleRelease --console=plain 2>&1 | tee build.log; then
            msg=$( { grep -E "^e: " build.log || true; grep -A8 "What went wrong" build.log || true; } | head -30 | sed ':a;N;$!ba;s/\n/%0A/g' )
            echo "::error::${msg:-Unbekannter Fehler}"
            exit 1
          fi
          cp beatifytv/build/outputs/apk/release/beatifytv-release.apk beatify-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: beatify-tv
          path: beatify-tv.apk
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "beatify-tv-v${GITHUB_RUN_NUMBER}" beatify-tv.apk --title "Beatify TV für Android TV v${GITHUB_RUN_NUMBER}" --notes "Eigenständige Beatify-TV-App für Android TV / Shield / Google TV." --latest=false
